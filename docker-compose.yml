services:
  db:
    image: postgres:16-alpine
    env_file: .env.production
    networks:
      - internal_network
    volumes:
      - ./db_data:/var/lib/postgresql/data
    restart: unless-stopped
    # api의 alembic 마이그레이션이 DB 기동 직후 접속 실패하지 않도록
    # 접속 가능 상태를 명시적으로 확인한다 ($$로 compose 치환 회피).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    env_file: .env.production
    networks:
      - external_network
      - internal_network
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./static:/app/static
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: ./web
      args:
        API_HOST: http://api:8000
        BASE_URL: ${BASE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    env_file: .env.production
    environment:
      - NODE_ENV=production
    networks:
      - external_network
      - internal_network
    volumes:
      - ./logs:/app/logs
    command: ./start.sh
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  external_network:
  internal_network:
    internal: true
