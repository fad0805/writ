version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env.production
    environment:
      - S3_ENABLED=${S3_ENABLED:-false}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./static:/app/static
      - ./logs:/app/logs
    restart: unless-stopped

  frontend:
    build: ./web
    ports:
      - "3000:3000"
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - API_HOST=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
