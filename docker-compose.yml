services:
  db:
    image: postgres:16-alpine
    env_file: .env.production
    networks:
      - internal_network
    volumes:
      - ./db_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    env_file: .env.production
    networks:
      - external_network
      - internal_network
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./static:/app/static
      - ./logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        - API_HOST=http://api:8000
    ports:
      - "3000:3000"
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - API_HOST=http://api:8000
    networks:
      - external_network
      - internal_network
    volumes:
      - ./logs:/app/logs
    command: sh -c "mkdir -p /app/logs && npm start 2>&1 | tee -a /app/logs/$$(date +%Y-%m-%d).log"
    depends_on:
      - api
    restart: unless-stopped

networks:
  external_network:
  internal_network:
    internal: true
