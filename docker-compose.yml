services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env.production
    environment:
      - S3_ENABLED=${S3_ENABLED:-false}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./static:/app/static
      - ./logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "3000:3000"
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - API_HOST=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file: .env.production
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./db_data:/var/lib/postgresql/data
    restart: unless-stopped
