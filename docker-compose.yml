version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env.production
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/sns_blog.db}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./static:/app/static
      - ./logs:/app/logs
    restart: unless-stopped

  frontend:
    build: ./web
    ports:
      - "3000:3000"
    env_file: .env.production
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
