services:
  db:
    image: postgres:16-alpine
    env_file: .env.production
    networks:
      - internal_network
    volumes:
      - ./db_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    env_file: .env.production
    networks:
      - external_network
      - internal_network
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./static:/app/static
      - ./logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    env_file: .env.production
    environment:
      - NODE_ENV=production
    networks:
      - external_network
      - internal_network
    volumes:
      - ./logs:/app/logs
    command: sh -c "mkdir -p /app/logs && echo 'waiting for api...' && for i in 1 2 3 4 5; do wget -q -O- http://api:8000/nodeinfo/2.0 2>/dev/null && break; echo 'api not ready, retry...'; sleep 2; done && npm start 2>&1 | tee -a /app/logs/$$(date +%Y-%m-%d).log"
    depends_on:
      - api
    restart: unless-stopped

networks:
  external_network:
  internal_network:
    internal: true
